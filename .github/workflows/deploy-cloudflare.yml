name: Deploy FateVerse to Cloudflare Workers

# Cloudflare Workers 掛在網域根目錄，所以用預設 base（`/`）的 npm run build。
# 需要 repo secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID。
# 沒設定時後續步驟全部跳過，不會讓 push 變紅燈，也不影響 Pages 那條線。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # secrets 這個 context 不能用在 job 層級的 if，只能在 step 裡取用，
      # 所以先由一個步驟把「有沒有設定」轉成 output，後面再據此跳過。
      - name: Check for Cloudflare credentials
        id: creds
        run: echo "ready=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - name: Report skip
        if: steps.creds.outputs.ready != 'true'
        run: echo "缺少 CLOUDFLARE_API_TOKEN 或 CLOUDFLARE_ACCOUNT_ID，略過 Cloudflare 部署。"

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.ready == 'true'
      - run: npm run build
        if: steps.creds.outputs.ready == 'true'
      - name: Publish to Cloudflare Workers
        if: steps.creds.outputs.ready == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
